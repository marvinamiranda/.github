# Publishes `governance/issue-link` as the Checks App ("MarvinaMiranda Checks")
# on a pull request's current head. Called from an adopted repository's
# `workflow_run` job (its PR gate). Epic marvinamiranda/.github#7, Task #10.
#
# WHY IT IS NOT pr-governance.yml. That workflow runs in `pull_request` context
# as the GitHub Actions app: any workflow a pull request adds runs as the same
# app, so the pull request can post a passing `governance/issue-link` itself,
# and the check run is filed in the commit's oldest Actions check suite, which
# the ruleset stops counting once that workflow runs again on the commit (the
# stranding fault of .github#6). Here the post is made by a different App, from
# default-branch code, with a key that only a job on `test` can read.
#
# WHAT HOLDS THE KEY. The job below names the environment `governance-checks`,
# whose only deployment rule is the default branch, `dev`. A `workflow_run` job
# runs the DEFAULT branch's copy of the caller, at the default branch's commit,
# so a pull request cannot edit the job that receives the key. But the
# environment admits ANY job whose ref is `dev` -- `workflow_run`,
# `pull_request_target`, `issue_comment` -- and it cannot stop such a job running pull request code
# (the custody review of .github#18). So this job must never check out, build,
# run or evaluate anything a pull request supplies:
#   * the only checkout is of marvinamiranda/.github at governance-ref, which
#     the first step proved is a merged commit of `test`;
#   * no `run:` step, and no `${{ }}` expression inside any script: everything
#     a script reads arrives through env or the event payload as DATA;
#   * the pull request's body is read by `issue-link.js` as text and matched;
#     it is never executed, and it reaches the check run only as a bounded
#     summary written through the API.
# governance/tests/issue-link-publish.test.js pins every one of these.
#
# ORDER, and why. (1) Verify the pin: nothing below runs unless it holds.
# (2) Fetch issue-link.js at governance-ref and judge, holding ONLY the read
# token. (3) Require a nonempty key with inline code, failing the job loudly
# if absent; then mint the Checks App token, after all fetched code has run,
# for this repository only, with `checks: write`
# only, revoked when the job ends. (4) One inline script reads the verdict as
# JSON and POSTs it with that token. The judge (fetched code) never sees the
# key; the step that sees the key runs only inline text of this file.
#
# A judge that cannot run (an API error) posts a FAILURE for the head rather
# than nothing: a stale success from before a body edit must not stand.
#
# Runs where the caller says (`runs-on` has no default and no hosted label is
# named here): adopted repositories pass '["self-hosted","gate-ephemeral"]', a
# clean single-use VM (decision E, .github#8). Only JavaScript actions are used,
# because that VM has the runner, git, python3, jq and curl and nothing else.
name: Publish governance/issue-link

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner for the job, as JSON (a label string or a list of labels). No
          default: adopted repositories pass '["self-hosted","gate-ephemeral"]'.
        type: string
        required: true
      governance-ref:
        description: >-
          Commit SHA of marvinamiranda/.github whose governance/issue-link.js is
          used -- the same SHA the caller pins this workflow to, and on its test
          branch.
        type: string
        required: true

    secrets:
      CHECKS_APP_PRIVATE_KEY:
        description: >-
          Forward this name explicitly from the caller; the called job's
          governance-checks environment value takes precedence. Never inherit.
        required: false

jobs:
  publish:
    name: publish governance/issue-link
    # Only the completion of a pull request's workflow run. Any other event
    # skips the job, so no token is minted for it.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    # Two runs for one commit would each post; queued, the last to run judges
    # the pull request as it is then. Not left to callers.
    concurrency:
      group: issue-link-publish-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    environment:
      name: governance-checks
      # Secrets without a deployment record per run (GitHub changelog,
      # 2026-03-19). The branch policy still applies.
      deployment: false
    # The GITHUB_TOKEN reads; it cannot write a check.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Verify the pin
        id: pin
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SELF_SHA: ${{ job.workflow_sha }}
          SELF_REPOSITORY: ${{ job.workflow_repository }}
          GOVERNANCE_REF: ${{ inputs.governance-ref }}
        with:
          script: |
            // BEGIN verify-pin: the same in both jobs; governance/tests/pr-governance.test.js runs it.
            async function verifyPin({ github, env }) {
              const self = env.SELF_SHA || '';
              const ref = env.GOVERNANCE_REF || '';
              if ((env.SELF_REPOSITORY || '').toLowerCase() !== 'marvinamiranda/.github') {
                return `This workflow is running from ${env.SELF_REPOSITORY || 'an unknown repository'}, not marvinamiranda/.github.`;
              }
              if (!/^[0-9a-f]{40}$/.test(self)) {
                return 'GitHub did not report the commit this workflow runs from (job.workflow_sha), so the pin cannot be checked.';
              }
              if (ref !== self) {
                return `governance-ref is "${ref}", but uses: pins ${self}. Set both to the same merged commit of marvinamiranda/.github.`;
              }
              // test is read as a branch, then compared by its sha: the bare
              // name "test" in a compare could resolve to a tag of that name.
              let tip;
              try {
                const { data: branch } = await github.rest.repos.getBranch({ owner: 'marvinamiranda', repo: '.github', branch: 'test' });
                tip = branch && branch.commit && branch.commit.sha;
              } catch (error) {
                return `Could not read marvinamiranda/.github test (HTTP ${error.status || '?'}), so the pin cannot be checked.`;
              }
              if (!/^[0-9a-f]{40}$/.test(tip || '')) {
                return 'GitHub returned no commit for marvinamiranda/.github test, so the pin cannot be checked.';
              }
              let status;
              try {
                ({ data: { status } } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: 'marvinamiranda', repo: '.github', basehead: `${tip}...${self}`, per_page: 1 }));
              } catch (error) {
                return `Could not compare ${self} with marvinamiranda/.github test (HTTP ${error.status || '?'}).`;
              }
              if (status !== 'identical' && status !== 'behind') {
                return `${self} is not on marvinamiranda/.github test (GitHub compares it as "${status}"). Pin a merged commit of test, never a pull request branch or a fork.`;
              }
              return '';
            }
            // END verify-pin
            const problem = await verifyPin({ github, env: process.env });
            core.setOutput('ok', problem ? 'false' : 'true');
            if (problem) {
              // Nothing is posted and no token is minted: the job fails, and the
              // reason is in its summary.
              await core.summary.addHeading('governance/issue-link was not published').addRaw(problem).write();
              core.setFailed(problem);
            }

      - name: Fetch the shared matcher
        if: steps.pin.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: marvinamiranda/.github
          ref: ${{ inputs.governance-ref }}
          path: .org-governance
          sparse-checkout: governance/issue-link.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Holds only the read GITHUB_TOKEN. Writes the verdict to a file; posts
      # nothing.
      - name: Judge the pull request
        id: judge
        if: steps.pin.outputs.ok == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const lib = require('./.org-governance/governance/issue-link.js');
            // The API refuses a summary over 65,535 characters. A crafted body can
            // make the judge's summary longer than that, the POST would be
            // rejected, and an older success would stand: so it is cut here.
            const CAP = 60000;
            const cap = (text) => {
              const s = String(text);
              return s.length <= CAP ? s : `${s.slice(0, CAP - 40)}\n\n(truncated)`;
            };
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run || {};
            // `pull_requests` lists EVERY open pull request whose head sha or head
            // branch matches the run, in any repository. Judge every listed PR
            // of this repository; an explicit other-repository association is
            // never permission to search for a different PR.
            const here = context.payload.repository && context.payload.repository.id;
            const validId = (id) => Number.isSafeInteger(id) && id > 0;
            const validRef = (ref) => typeof ref === 'string' && ref.trim() === ref && ref.length > 0;
            const runHead = /^[0-9a-f]{40}$/.test(run.head_sha || '') ? run.head_sha : undefined;
            const failOnRunHead = async (reason, failJobAfterPost = false) => {
              if (!runHead) {
                core.setFailed(`${reason} No valid run head exists, so nothing is posted.`);
                return;
              }
              const verdict = { headSha: runHead, ok: false,
                title: 'The issue-link publisher could not verify this run', summary: cap(reason) };
              if (failJobAfterPost) verdict.failJobAfterPost = true;
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'issue-link-verdict.json'), JSON.stringify([verdict]));
              core.setOutput('judged', 'true');
              await core.summary.addHeading('governance/issue-link').addRaw(verdict.summary).write();
            };
            if (run.pull_requests != null && !Array.isArray(run.pull_requests)) {
              await failOnRunHead('The workflow run has a malformed pull request association.');
              return;
            }
            const listed = run.pull_requests || [];
            let mine = listed.filter((p) => p && Number.isInteger(p.number) && p.number >= 1
              && here !== undefined && p.base && p.base.repo && p.base.repo.id === here);
            let recovered = null;
            if (listed.length === 0) {
              // GitHub sometimes omits the workflow_run PR association. The
              // open head-branch listing supplies candidates, not identity:
              // only one open PR with this exact SHA, branch and same-repository
              // head/base may be recovered. The default branch is a valid head
              // for a release PR to main; no branch-name allow-list is used.
              const branch = run.head_branch;
              const runRepo = run.head_repository && run.head_repository.id;
              if (!runHead || !validRef(branch) || !validId(here) || runRepo !== here) {
                await failOnRunHead('The workflow run has no complete same-repository head identity for PR recovery.');
                return;
              }
              let candidates;
              try {
                candidates = await github.paginate(github.rest.pulls.list,
                  { owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100 });
              } catch (error) {
                const status = error && Number.isInteger(error.status) ? error.status : '?';
                await failOnRunHead(`Could not list open pull requests for the run branch (HTTP ${status}).`);
                return;
              }
              if (!Array.isArray(candidates)) {
                await failOnRunHead('The open pull request listing is malformed.');
                return;
              }
              const open = [];
              for (const candidate of candidates) {
                const head = candidate && candidate.head;
                const base = candidate && candidate.base;
                if (!candidate || !['open', 'closed'].includes(candidate.state)) {
                  await failOnRunHead('The open pull request listing contains a malformed candidate.');
                  return;
                }
                // Ignore irrelevant rows before validating their remaining fields.
                // The head filter is only a hint; every eligible row is checked.
                if (candidate.state !== 'open' || (head && /^[0-9a-f]{40}$/.test(head.sha || '') && head.sha !== runHead)
                    || (head && head.repo && validId(head.repo.id) && head.repo.id !== here)
                    || (base && base.repo && validId(base.repo.id) && base.repo.id !== here)) continue;
                if (!validId(candidate.number) || !head || head.sha !== runHead || !validRef(head.ref)
                    || !head.repo || head.repo.id !== here || !base || !validRef(base.ref)
                    || !base.repo || base.repo.id !== here) {
                  await failOnRunHead('An eligible pull request has a malformed head or repository identity.');
                  return;
                }
                if (head.ref !== branch) {
                  await failOnRunHead('An open pull request on the run commit does not match its branch identity.');
                  return;
                }
                open.push(candidate);
              }
              if (open.length !== 1) {
                await failOnRunHead('The run commit does not identify exactly one open same-repository pull request.');
                return;
              }
              recovered = open[0];
              mine = [recovered];
            }
            if (mine.length === 0) {
              await failOnRunHead('The workflow run lists no pull request of this repository.');
              return;
            }
            const recoveredIsCurrent = async (number) => {
              let current;
              try {
                ({ data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
              } catch (error) {
                // The caller will issue a failure verdict on the known run head.
                return false;
              }
              if (!current || current.number !== number || current.state !== 'open'
                  || !current.head || current.head.sha !== runHead || current.head.ref !== run.head_branch
                  || !current.head.repo || current.head.repo.id !== here
                  || !current.base || current.base.ref !== recovered.base.ref
                  || !current.base.repo || current.base.repo.id !== here) {
                return false;
              }
              return true;
            };
            const judged = [];
            for (const listedPull of mine) {
              const number = listedPull.number;
              if (recovered && !(await recoveredIsCurrent(number))) {
                await failOnRunHead('The recovered pull request could not be revalidated before judging.');
                return;
              }
              let verdict;
              try {
                // judge() reads the pull request now, not from the event.
                verdict = await lib.judge({ github, context: { repo: context.repo, payload: { pull_request: { number } } } });
              } catch (error) {
                // Fail closed: a verdict that could not be reached is a failure on
                // the head, not silence that leaves an older success standing.
                const status = error && error.status ? `HTTP ${error.status}` : 'an error';
                // Bounded exception category identifies the cause without
                // publishing an arbitrary error message or request headers.
                const exception = error && typeof error.name === 'string'
                  && /^[A-Za-z][A-Za-z0-9_]{0,63}$/.test(error.name) ? error.name : 'Error';
                let headSha = runHead;
                if (!recovered) {
                  try {
                    ({ data: { head: { sha: headSha } } } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
                  } catch (again) {
                    // The run's own head is the fallback: still a failure, on a commit.
                  }
                }
                if (!headSha) {
                  core.setFailed(`The judge failed (${status}) and no head commit could be found. Nothing is posted.`);
                  return;
                }
                verdict = {
                  ok: false,
                  title: 'The issue-link judge could not run',
                  summary: `The judge failed with ${exception} (${status}). Re-run the PR gate. This failure is posted so an older success does not stand.`,
                  headSha,
                };
              }
              if (recovered) {
                // issue-link.js rereads the PR. A force-push between our first
                // read and its read must not green-light an unrelated new head.
                if (!verdict) {
                  await failOnRunHead('The issue-link judge returned no verdict.', true);
                  return;
                }
                if (verdict.headSha !== runHead || !(await recoveredIsCurrent(number))) {
                  await failOnRunHead('The recovered pull request or matcher verdict changed identity during judging.');
                  return;
                }
              } else if (!verdict) {
                await failOnRunHead('The issue-link judge returned no verdict.', true);
                return;
              }
              judged.push({ number, ...verdict });
            }
            // One verdict per head commit: a success only if EVERY pull request
            // judged on that commit passed.
            const heads = new Map();
            for (const j of judged) heads.set(j.headSha, [...(heads.get(j.headSha) || []), j]);
            const verdicts = [...heads].map(([headSha, group]) => {
              const failing = group.filter((j) => j.ok !== true);
              if (group.length === 1) {
                const only = group[0];
                return { headSha, ok: only.ok === true, title: String(only.title).slice(0, 255), summary: cap(only.summary) };
              }
              const ok = failing.length === 0;
              return {
                headSha,
                ok,
                title: (ok ? `All ${group.length} pull requests on this commit close an issue`
                  : `#${failing[0].number}: ${failing[0].title}`).slice(0, 255),
                summary: cap(group.map((j) => `#${j.number}: ${j.ok === true ? 'passes' : 'FAILS'}: ${j.title}\n${j.summary}`).join('\n\n')),
              };
            });
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'issue-link-verdict.json'), JSON.stringify(verdicts));
            core.setOutput('judged', 'true');
            for (const v of verdicts) await core.summary.addHeading('governance/issue-link').addRaw(v.summary).write();

      # After fetched code is finished, fail loudly if the cross-repo named
      # key did not resolve. This inline check reveals presence only, never
      # the key or an arbitrary error message. A failure keeps the job red.
      - name: Require the Checks App key
        id: key
        if: steps.pin.outputs.ok == 'true' && steps.judge.outputs.judged == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CHECKS_PRIVATE_KEY: ${{ secrets.CHECKS_APP_PRIVATE_KEY }}
        with:
          script: |
            if (!(process.env.CHECKS_PRIVATE_KEY || '').trim()) {
              core.setFailed('CHECKS_APP_PRIVATE_KEY is empty. Check explicit named forwarding and the governance-checks environment. No App token is minted and no check is posted.');
              return;
            }
            core.setOutput('ready', 'true');

      # This repository only, `checks: write` only.
      - name: Mint the Checks App token
        id: checks-app
        if: steps.pin.outputs.ok == 'true' && steps.judge.outputs.judged == 'true' && steps.key.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHECKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      # The one POST. Inline text only: it reads the verdict as JSON data.
      - name: Publish governance/issue-link
        if: steps.pin.outputs.ok == 'true' && steps.judge.outputs.judged == 'true' && steps.key.outputs.ready == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.checks-app.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const verdicts = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'issue-link-verdict.json'), 'utf8'));
            if (!Array.isArray(verdicts) || verdicts.length === 0
                || !verdicts.every((v) => v && /^[0-9a-f]{40}$/.test(v.headSha || ''))) {
              core.setFailed('A verdict names no head commit. Nothing is posted.');
              return;
            }
            // Never over the API's 65,535-character summary limit (see the judge).
            const cap = (text) => {
              const s = String(text);
              return s.length <= 60000 ? s : `${s.slice(0, 59960)}\n\n(truncated)`;
            };
            for (const verdict of verdicts) {
              await github.request('POST /repos/{owner}/{repo}/check-runs', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'governance/issue-link',
                head_sha: verdict.headSha,
                status: 'completed',
                conclusion: verdict.ok === true ? 'success' : 'failure',
                output: { title: String(verdict.title).slice(0, 255), summary: cap(verdict.summary) },
              });
            }
            // A missing judge result is an internal failure too. Wait until
            // its failure check has posted so an older success cannot stand.
            if (verdicts.some((v) => v.failJobAfterPost === true)) {
              core.setFailed('The issue-link judge returned no verdict. A failure check was posted.');
            }
