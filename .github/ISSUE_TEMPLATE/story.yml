name: "Story"
description: "The smallest independently demonstrable vertical slice with complete acceptance and test evidence."
title: "[story] "
type: Task
body:
  - type: markdown
    attributes:
      value: |
        A Ready Story must be executable without loading the entire knowledge base. It still links canonical authorities rather than copying them.

  - type: textarea
    id: outcome
    attributes:
      label: Actor, outcome and reason
      description: Who needs what observable result and why?
    validations:
      required: true

  - type: textarea
    id: canonical
    attributes:
      label: Canonical authorities and delivery horizon
      description: Link the Feature, product/system notes, workflows, rules, decisions and approved milestone/horizon.
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: Current and desired behaviour
      description: State “not present” for greenfield work. Do not infer desired behaviour from current code.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      placeholder: |
        In scope:
        -

        Non-goals:
        -
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Inputs, outputs and rules
      description: Include state transitions, units, rounding, time and locale behaviour where applicable.
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Entitlements, permissions and audit
      description: Define tenant/location/workspace/device/user authority and required audit evidence.
    validations:
      required: true

  - type: textarea
    id: failures
    attributes:
      label: Errors, edge cases and recovery
      description: Cover invalid, unavailable, duplicate, partial, concurrent and offline/reconnect behaviour as applicable.
    validations:
      required: true

  - type: textarea
    id: ux
    attributes:
      label: UX journey
      description: Entry, navigation, important states, responsive/accessibility/language behaviour and mock/design links. Write “not user-visible” when applicable.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Systems, repositories and dependencies
      description: Name the owning repository, contracts/data ownership, blockers and sequencing.
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: Migration, rollout and operational effects
      description: Compatibility, data/configuration changes, feature/entitlement gating, rollback and observability.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Independently pass/fail outcomes, including negative and recovery cases.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] An unauthorised/invalid attempt ...
        - [ ] A failure/retry/recovery ...
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification matrix
      description: Specify applicable unit, architecture, integration, contract, database, browser/mobile, navigation, accessibility, security, performance, resilience, migration, hardware and operational checks.
    validations:
      required: true

  - type: textarea
    id: running
    attributes:
      label: Running-product acceptance
      description: Environment, actor/setup, exact journey, expected observations and evidence to capture.
    validations:
      required: true

  - type: textarea
    id: knowledge
    attributes:
      label: Knowledge and downstream documentation impact
      description: Canonical notes, code maps, manuals, runbooks, training, marketing or RAG outputs affected.
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready
      options:
        - label: "The outcome and canonical baseline are approved."
          required: true
        - label: "Dependencies, decisions and non-goals are explicit."
          required: true
        - label: "The Story is independently demonstrable and testable."
          required: true
        - label: "No current-code assumption has silently narrowed the requirement."
          required: true
