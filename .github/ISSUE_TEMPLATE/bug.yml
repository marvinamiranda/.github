name: "Bug"
description: "Observed behaviour that contradicts the docs or the tests. Fixed in one pull request, with a test that failed first."
type: Bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened, who or what is affected, and any workaround.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened, with a link to the doc or test that says so.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact steps or commands. Remove secrets and personal data.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: revision
    attributes:
      label: Revision and environment
      description: Environment and URL, deployed revision or commit SHA, device/OS/browser, first and last seen.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Impact, not delivery priority. Priority is the Project field.
      options:
        - "Critical — outage, data loss or corruption, or a security exposure"
        - "Major — a workflow is blocked with no acceptable workaround"
        - "Minor — wrong, but a workaround exists"
        - "Cosmetic — presentation only"
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Suspected area
      description: The `area:` this most likely lives in, and the file if known. Set the `area:` label to match.
    validations:
      required: true

  - type: textarea
    id: failing-test
    attributes:
      label: The failing test to add
      description: The test that reproduces this and must be seen failing before the fix — file, name and level.
    validations:
      required: true
