name: "Initiative"
description: "A large measurable outcome spanning multiple features, systems, repositories or delivery horizons."
title: "[initiative] "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Initiatives define **why and what outcome**, not implementation tasks. Add child Features through GitHub sub-issues after approval.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome and problem
      description: What measurable business or operational result is needed, for whom, and why now?
    validations:
      required: true

  - type: textarea
    id: measures
    attributes:
      label: Success measures
      description: Observable measures that prove the Initiative outcome, not only that child work was closed.
      placeholder: |
        - [ ] Measure, baseline and target
        - [ ] Operational or customer evidence
    validations:
      required: true

  - type: textarea
    id: canonical
    attributes:
      label: Canonical authorities and approval
      description: Links to approved product/system knowledge, decisions and the approval source.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      placeholder: |
        In scope:
        -

        Non-goals:
        -
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: Products, systems and repositories
      description: Identify affected boundaries and the primary product owner.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Decisions, dependencies and material risks
      description: List unresolved decisions with owners, external dependencies and high-risk boundaries.
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: Child Feature plan
      description: Describe the expected capability decomposition. Replace with native sub-issues when created.
    validations:
      required: true
